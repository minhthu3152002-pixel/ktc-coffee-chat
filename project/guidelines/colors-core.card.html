<!-- @dsCard group="Colors" viewport="700x150" name="Brand Core" subtitle="Navy, royal blue, KTC pink & sky cyan — the four mandated brand colors" -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; background: var(--white); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .sw { border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-1); }
  .chip { height: 76px; }
  .meta { padding: 10px 12px; }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--navy-800); }
  .hex { font-family: var(--font-body); font-size: 11px; color: var(--ink-500); letter-spacing: 0.4px; margin-top: 2px; }
</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--navy-800)"></div><div class="meta"><div class="name">Navy</div><div class="hex">#0F2050</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--blue-600)"></div><div class="meta"><div class="name">Blue</div><div class="hex">#1A56DB</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--pink-600)"></div><div class="meta"><div class="name">Pink</div><div class="hex">#EC174C</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--cyan-500)"></div><div class="meta"><div class="name">Cyan</div><div class="hex">#0E8BFD</div></div></div>
</div>
</body>
</html>
