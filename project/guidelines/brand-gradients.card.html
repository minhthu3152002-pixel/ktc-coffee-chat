<!-- @dsCard group="Brand" viewport="700x150" name="Signature Gradients" subtitle="Hero wash, KTC pink→blue, and the navy→blue brand sweep" -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px 26px; background: var(--white); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .g { height: 92px; border-radius: var(--radius-lg); border: 1px solid var(--border-1); display: flex; align-items: flex-end; padding: 10px; }
  .n { font-family: var(--font-body); font-size: 11px; font-weight: 700; }
</style>
</head>
<body style="background-color: rgb(255, 255, 255)">
<div class="row">
  <div class="g" style="background: var(--grad-hero); border-style: solid"><span class="n" style="color:var(--navy-800)">--grad-hero</span></div>
  <div class="g" style="background:var(--grad-ktc)"><span class="n" style="color:#fff">--grad-ktc</span></div>
  <div class="g" style="background:var(--grad-brand)"><span class="n" style="color:#fff">--grad-brand</span></div>
</div>
</body>
</html>
