<!-- @dsCard group="Type" viewport="700x180" name="Display — SVN-Servetica" subtitle="Headline face. Two weights: Thin & Medium. Tight tracking" -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 26px; background: var(--white); }
  .big { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1.1; letter-spacing: -0.5px; color: var(--navy-800); }
  .big .accent { color: var(--blue-600); }
  .row { display: flex; gap: 28px; margin-top: 14px; align-items: baseline; flex-wrap: wrap; }
  .w { font-family: var(--font-display); font-size: 22px; color: var(--navy-800); }
  .lbl { font-family: var(--font-body); font-size: 10px; color: var(--ink-500); display: block; margin-top: 2px; letter-spacing: 0.5px; }
</style>
</head>
<body>
<div class="big">Gặp gỡ <span class="accent">FPT Software</span> Korea</div>
<div class="row">
  <div><span class="w" style="font-weight:200">Thin</span><span class="lbl">Aa Gặp gỡ onsite</span></div>
  <div><span class="w" style="font-weight:500">Medium</span><span class="lbl">Aa Gặp gỡ onsite</span></div>
  <div><span class="w" style="font-weight:800">Headings use Medium</span><span class="lbl">Aa Gặp gỡ onsite</span></div>
</div>
</body>
</html>
