<!-- @dsCard group="Type" viewport="700x300" name="Type Scale" subtitle="From hero display down to tag ids, with token names" -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 24px 26px; background: var(--white); }
  .item { display: flex; align-items: baseline; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--border-1); }
  .item:last-child { border-bottom: none; }
  .spec { font-family: var(--font-body); font-size: 10px; color: var(--ink-500); width: 150px; flex-shrink: 0; letter-spacing: 0.3px; }
  .d { font-family: var(--font-display); color: var(--navy-800); font-weight: 800; line-height: 1.1; }
  .b { font-family: var(--font-body); color: var(--ink-700); }
</style>
</head>
<body>
<div class="item"><span class="spec">--fs-display · 50px</span><span class="d" style="font-size:34px">Display heading</span></div>
<div class="item"><span class="spec">--fs-h1 · 38px</span><span class="d" style="font-size:28px">Section title</span></div>
<div class="item"><span class="spec">--fs-h3 · 19px</span><span class="d" style="font-size:19px">Card title</span></div>
<div class="item"><span class="spec">--fs-lead · 16px</span><span class="b" style="font-size:16px">Lead paragraph intro</span></div>
<div class="item"><span class="spec">--fs-body · 15px</span><span class="b" style="font-size:15px">Body copy, default running text</span></div>
<div class="item"><span class="spec">--fs-sm · 13px</span><span class="b" style="font-size:13px">Small / field text</span></div>
<div class="item"><span class="spec">--fs-2xs · 11px</span><span class="b" style="font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--blue-600)">EYEBROW LABEL</span></div>
</body>
</html>
