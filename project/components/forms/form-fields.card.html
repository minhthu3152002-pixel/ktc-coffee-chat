<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { padding: 28px; background: var(--white); }
  .grid { max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Input, Select, Textarea } = window.KTCFPTCoffeeChatDesignSystem_4d8682;
  function Demo() {
    return (
      <div className="grid">
        <Input label="Họ và tên" required placeholder="Nguyễn Văn A" />
        <div className="two">
          <Input label="Email" required type="email" placeholder="email@example.com" />
          <Input label="Điện thoại" required placeholder="09xx xxx xxx" />
        </div>
        <div className="two">
          <Select label="Kinh nghiệm" required options={['Fresher (dưới 1 năm)', '1–2 năm', '3–5 năm', '5+ năm']} />
          <Select label="Đã apply KTC?" required options={['Rồi', 'Chưa']} />
        </div>
        <Textarea label="Câu hỏi muốn hỏi" placeholder="Bạn đang thắc mắc điều gì về onsite Hàn?" />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
